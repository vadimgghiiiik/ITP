<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ИТП — Социальная сеть</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="screen-loading" class="screen active" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center;">
        <div class="logo" style="font-size: 36px; margin-bottom: 20px;">ИТП</div>
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: var(--text-muted); font-size: 14px;">Проверка сессии...</p>
    </div>

    <header style="display: none;" id="mainHeader">
        <div class="logo">ИТП</div>
        <div class="header-right">
            <button class="theme-toggle" onclick="switchScreen('notifications')" title="Уведомления" style="position:relative;">
                🔔 <span id="notifBadge" class="nav-badge" style="display:none; top:2px; right:2px;">0</span>
            </button>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Сменить тему">🌙</button>
            <div class="user-badge" id="headerUserBadge" onclick="switchScreen('profile')" style="display:none;">
                <span id="headerUserName">Пользователь</span>
                <img id="headerUserAvatar" src="" alt="Avatar">
            </div>
        </div>
    </header>

    <div id="screen-auth" class="screen">
        <div class="auth-card">
            <h2>Вход в ИТП</h2>
            <input type="text" id="authLogin" placeholder="Логин" maxlength="30" autocomplete="username">
            <input type="password" id="authPassword" placeholder="Пароль" maxlength="60" autocomplete="current-password" onkeypress="if(event.key==='Enter'){event.preventDefault();doLogin();}">
            <button onclick="doLogin()" id="loginBtn">Войти</button>
            <button class="btn-secondary" onclick="switchScreen('register')">Регистрация</button>
            <button class="btn-secondary" onclick="clearLocalData()" style="font-size:12px;opacity:.7;">Очистить локальные данные</button>
            <p class="auth-error" id="authError"></p>
        </div>
    </div>

    <div id="screen-register" class="screen">
        <div class="auth-card">
            <h2>Регистрация</h2>
            <input type="text" id="regLogin" placeholder="Логин (латиница, 3-20)" maxlength="20" autocomplete="username">
            <input type="text" id="regName" placeholder="Отображаемое имя" maxlength="30">
            <input type="password" id="regPassword" placeholder="Пароль (мин. 6)" maxlength="60" autocomplete="new-password">
            <input type="password" id="regPassword2" placeholder="Повтор пароля" maxlength="60" autocomplete="new-password" onkeypress="if(event.key==='Enter'){event.preventDefault();doRegister();}">
            <button onclick="doRegister()" id="regBtn">Создать аккаунт</button>
            <button class="btn-secondary" onclick="switchScreen('auth')">Назад</button>
            <p class="auth-error" id="regError"></p>
        </div>
    </div>

    <div id="screen-feed" class="screen">
        <div class="feed-form">
            <textarea id="postText" placeholder="Что у вас нового? #теги @упоминания" maxlength="2000"></textarea>
            
            <div id="pollPreviewWrap" style="display:none; margin-top:10px; background:var(--bg-input); padding:10px; border-radius:12px; border:1px solid var(--border);">
                <input type="text" id="pollQ" placeholder="Вопрос опроса..." style="margin-bottom:8px; font-weight:bold; width:100%; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text-primary);">
                <input type="text" class="poll-opt" placeholder="Вариант 1" style="width:100%; padding:8px; margin-bottom:4px; border-radius:6px; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text-primary);">
                <input type="text" class="poll-opt" placeholder="Вариант 2" style="width:100%; padding:8px; margin-bottom:4px; border-radius:6px; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text-primary);">
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <button type="button" class="btn-secondary" onclick="addPollOption()" style="font-size:12px; padding:4px 8px;">+ Вариант</button>
                    <button type="button" class="btn-secondary" onclick="clearPoll()" style="font-size:12px; padding:4px 8px; color:var(--accent);">Отмена</button>
                </div>
            </div>

            <div id="postImagePreviewWrap" style="display:none; margin-top:10px; position:relative;">
                <img id="postImagePreview" style="max-width:100%; max-height:220px; border-radius:12px; display:block; margin:0 auto; border:1px solid var(--border);">
                <button type="button" onclick="clearPostImage()" style="position:absolute; top:6px; right:6px; background:rgba(0,0,0,.65); color:#fff; border:none; border-radius:50%; width:28px; height:28px; padding:0; font-size:14px; cursor:pointer; box-shadow:none;">✕</button>
            </div>
            <div class="form-actions">
                <div style="display:flex; align-items:center; gap:6px;">
                    <button type="button" class="btn-secondary" onclick="document.getElementById('postImageInput').click()" style="padding:8px; font-size:16px;" title="Фото">📷</button>
                    <button type="button" class="btn-secondary" onclick="document.getElementById('pollPreviewWrap').style.display='block'" style="padding:8px; font-size:16px;" title="Опрос">📊</button>
                    <input type="file" id="postImageInput" accept="image/*" style="display:none" onchange="handlePostImageSelect(event)">
                    <span id="postCounter" class="post-counter">0 / 2000</span>
                </div>
                <button id="postSubmitBtn" onclick="addPost()">Опубликовать</button>
            </div>
        </div>
        <div id="postsContainer">Загрузка ИТП...</div>
        <div id="feedLoader" style="text-align:center; padding:20px; display:none;"><div class="spinner" style="margin:0 auto;"></div></div>
    </div>

    <div id="screen-notifications" class="screen">
        <h2 style="margin-bottom:16px;">Уведомления</h2>
        <div id="notificationsContainer"></div>
    </div>

    <div id="screen-people" class="screen">
        <div class="people-search"><input type="text" id="peopleSearchInput" placeholder="🔍 Поиск..." oninput="renderPeopleList()"></div>
        <div id="peopleContainer"></div>
    </div>

    <div id="screen-chats" class="screen">
        <div id="chatsListView">
            <div class="chats-list-header"><h2>Чаты</h2></div>
            <div id="chatsList"></div>
        </div>
        <div id="chatRoomView" style="display:none;">
            <div class="chat-room-topbar">
                <button class="chat-back-btn" onclick="closeChatRoom()">←</button>
                <img id="chatRoomAvatar" class="chat-room-avatar" src="" onclick="openChatPartnerProfile()" style="cursor:pointer;">
                <div class="chat-room-name-block" onclick="openChatPartnerProfile()" style="cursor:pointer;">
                    <div id="chatRoomName" class="chat-room-name">—</div>
                    <div id="chatRoomLogin" class="chat-room-login"></div>
                </div>
            </div>
            <div class="chat-layout">
                <div id="chatMessagesContainer" class="chat-messages"></div>
                <div id="chatReplyWrap" style="display:none; padding:8px 12px; background:var(--bg-elevated); border-top:1px solid var(--border); position:relative; font-size:13px; color:var(--text-muted);">
                    <div style="border-left:3px solid var(--accent); padding-left:8px;">Ответ на: <span id="chatReplyText" style="color:var(--text-secondary);"></span></div>
                    <button type="button" onclick="cancelReply()" style="position:absolute; top:4px; right:8px; background:none; border:none; color:var(--accent); cursor:pointer;">✕</button>
                </div>
                <div class="chat-footer">
                    <button type="button" onclick="document.getElementById('chatImageInput').click()" style="background:var(--bg-elevated); color:var(--text-primary); border:1px solid var(--border);">📷</button>
                    <input type="file" id="chatImageInput" accept="image/*" style="display:none" onchange="handleChatImageSelect(event)">
                    <input type="text" id="chatMessageInput" placeholder="Напишите сообщение..." maxlength="1000" onkeypress="if(event.key==='Enter'){event.preventDefault();sendDirectMessage();}">
                    <button onclick="sendDirectMessage()" id="chatSendBtn">➤</button>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-profile" class="screen">
        <div class="profile-card">
            <div class="avatar-wrapper" onclick="document.getElementById('avatarFileInput').click()">
                <img id="profileAvatarImg" src=""><div class="avatar-overlay">📷 Сменить</div>
            </div>
            <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
            <input type="text" id="profileNameInput" class="profile-input" placeholder="Ваше имя" maxlength="30">
            <textarea id="profileBioInput" class="profile-bio-input" placeholder="О себе" maxlength="200"></textarea>
            <p class="profile-login">Логин: <span id="profileLoginValue">—</span></p>
            <div class="profile-stats">
                <div class="stat-item"><span class="stat-num" id="myPostsCount">0</span><span class="stat-label">Постов</span></div>
                <div class="stat-item"><span class="stat-num" id="myLikesCount">0</span><span class="stat-label">Лайков</span></div>
                <div class="stat-item"><span class="stat-num" id="myFollowingCount">0</span><span class="stat-label">Подписок</span></div>
            </div>
            <div class="profile-buttons">
                <button onclick="saveProfile()" id="saveProfileBtn">Сохранить профиль</button>
                <button class="btn-secondary" onclick="resetAvatar()">Сбросить аватар</button>
                <button class="btn-secondary logout-btn" onclick="logout()">Выйти</button>
            </div>
        </div>
        <div id="myPostsContainer"></div>
    </div>

    <div id="screen-user" class="screen">
        <div class="profile-card">
            <img id="userProfileAvatar" class="user-profile-avatar" src="">
            <h3 class="user-profile-name"><span id="userProfileName">—</span><span id="userProfileBadge"></span></h3>
            <p class="profile-login">Логин: <span id="userProfileLogin">—</span></p>
            <p id="userProfileBio" class="user-profile-bio"></p>
            <div class="profile-stats">
                <div class="stat-item"><span class="stat-num" id="userPostsCount">0</span><span class="stat-label">Постов</span></div>
                <div class="stat-item"><span class="stat-num" id="userLikesCount">0</span><span class="stat-label">Лайков</span></div>
                <div class="stat-item"><span class="stat-num" id="userFollowingCount">0</span><span class="stat-label">Подписок</span></div>
            </div>
            <div class="profile-buttons">
                <button id="userFollowBtn" onclick="toggleFollowViewedUser()">Подписаться</button>
                <button onclick="openChatWithViewedUser()">💬 Написать сообщение</button>
                <button class="btn-secondary" style="color:var(--accent); border-color:var(--accent);" id="blockUserBtn" onclick="toggleBlockViewedUser()">Заблокировать</button>
                <button class="btn-secondary" onclick="switchScreen('feed')">← Назад</button>
            </div>
        </div>
        <div id="userPostsContainer"></div>
    </div>

    <nav id="mainNav" style="display:none;">
        <div class="nav-item active" id="nav-feed" onclick="switchScreen('feed')"><span class="nav-icon">📰</span><span>Лента</span></div>
        <div class="nav-item" id="nav-people" onclick="switchScreen('people')"><span class="nav-icon">👥</span><span>Люди</span></div>
        <div class="nav-item" id="nav-chats" onclick="switchScreen('chats')"><span class="nav-icon">💬</span><span>Чаты</span><span id="chatsNavBadge" class="nav-badge" style="display:none;">0</span></div>
        <div class="nav-item" id="nav-profile" onclick="switchScreen('profile')"><span class="nav-icon">👤</span><span>Профиль</span></div>
    </nav>

    <div id="commentsModal" class="modal-overlay" onclick="if(event.target===this) closeComments()">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3>Комментарии</h3>
                <button class="btn-secondary" onclick="closeComments()" style="padding:4px 8px;">✕</button>
            </div>
            <div id="commentsList" style="max-height:300px; overflow-y:auto; margin-bottom:16px;"></div>
            <div style="display:flex; gap:8px;">
                <input type="text" id="commentInput" placeholder="Написать комментарий..." maxlength="500" style="flex:1;" onkeypress="if(event.key==='Enter'){event.preventDefault();addComment();}">
                <button onclick="addComment()" id="commentSubmitBtn">➤</button>
            </div>
        </div>
    </div>

    <div id="repostModal" class="modal-overlay" onclick="if(event.target===this) closeRepost()">
        <div class="modal-content">
            <h3 style="margin-bottom:16px;">Репост</h3>
            <textarea id="repostText" placeholder="Добавить комментарий к репосту..." maxlength="500" style="width:100%; min-height:80px; margin-bottom:12px; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-input); color:var(--text-primary);"></textarea>
            <div style="display:flex; gap:8px;">
                <button onclick="submitRepost()" style="flex:1;">Опубликовать репост</button>
                <button class="btn-secondary" onclick="closeRepost()">Отмена</button>
            </div>
        </div>
    </div>

<style>
    :root { --bg-body: #0a0a0b; --bg-header: #16171a; --bg-card: #1a1b1f; --bg-elevated: #22242a; --bg-input: #101114; --bg-hover: #26282f; --text-primary: #f5f5f7; --text-secondary: #b6b8c0; --text-muted: #6e7078; --accent: #ff4d4d; --accent-hover: #e03a3a; --accent-soft: rgba(255, 77, 77, 0.12); --blue: #4bacff; --border: #2a2c33; --border-hover: #3a3c44; --shadow-sm: 0 1px 2px rgba(0,0,0,.25); --shadow-md: 0 4px 14px rgba(0,0,0,.35); --shadow-lg: 0 12px 32px rgba(0,0,0,.5); --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px; --transition: .18s cubic-bezier(.4,0,.2,1); }
    body.light { --bg-body: #f4f5f7; --bg-header: #ffffff; --bg-card: #ffffff; --bg-elevated: #f0f1f4; --bg-input: #f0f1f4; --bg-hover: #e8eaee; --text-primary: #14161a; --text-secondary: #4a4d55; --text-muted: #8a8d94; --accent: #e63946; --accent-hover: #c92c39; --accent-soft: rgba(230, 57, 70, 0.10); --blue: #1877f2; --border: #e1e3e8; --border-hover: #c8cad0; --shadow-sm: 0 1px 2px rgba(0,0,0,.06); --shadow-md: 0 4px 14px rgba(0,0,0,.08); --shadow-lg: 0 12px 32px rgba(0,0,0,.12); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: manipulation; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    button, .nav-item, .action-btn, .post-header, .person-card, .user-badge, .theme-toggle, .avatar-wrapper, .chat-list-item, .chat-room-avatar, .chat-room-name-block { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    body { background: var(--bg-body); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif; font-size: 15px; line-height: 1.45; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; transition: background var(--transition), color var(--transition); }
    header { background: var(--bg-header); padding: 12px 16px; font-size: 20px; font-weight: 800; color: var(--accent); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px); transition: background var(--transition), border-color var(--transition); }
    .logo { font-weight: 900; letter-spacing: .5px; font-size: 22px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .theme-toggle { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-primary); font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background var(--transition), transform var(--transition), border-color var(--transition); padding: 0; line-height: 1; }
    .theme-toggle:hover { background: var(--bg-hover); transform: rotate(20deg); }
    .theme-toggle:active { transform: scale(.92); }
    .user-badge { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-primary); cursor: pointer; max-width: 60%; padding: 4px 10px 4px 4px; border-radius: var(--radius-pill); background: var(--bg-elevated); border: 1px solid var(--border); transition: background var(--transition), border-color var(--transition); }
    .user-badge:hover { background: var(--bg-hover); border-color: var(--border-hover); }
    .user-badge span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
    .user-badge img { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-input); border: 2px solid var(--accent); object-fit: cover; flex-shrink: 0; }
    .screen { display: none; padding: 16px 16px 40px; max-width: 620px; margin: 0 auto; animation: fadeIn .25s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px 24px; max-width: 380px; margin: 48px auto; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-lg); }
    .auth-card h2 { color: var(--text-primary); text-align: center; margin-bottom: 6px; font-size: 22px; font-weight: 800; }
    .auth-card h2::first-letter { color: var(--accent); }
    .auth-card input { padding: 13px 14px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); border-radius: var(--radius-md); outline: none; font-size: 15px; font-family: inherit; transition: border-color var(--transition), background var(--transition); }
    .auth-card input:focus { border-color: var(--accent); background: var(--bg-elevated); }
    .auth-card input::placeholder { color: var(--text-muted); }
    .auth-error { color: var(--accent); font-size: 13px; text-align: center; min-height: 16px; word-wrap: break-word; }
    button { background: var(--accent); color: #fff; border: none; padding: 11px 20px; border-radius: var(--radius-md); cursor: pointer; font-weight: 700; font-size: 14px; font-family: inherit; transition: background var(--transition), transform var(--transition), opacity var(--transition); box-shadow: var(--shadow-sm); }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); box-shadow: none; }
    .btn-secondary:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--border-hover); }
    .logout-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .logout-btn:hover:not(:disabled) { background: var(--accent-soft); }
    .feed-form { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 18px; box-shadow: var(--shadow-md); transition: border-color var(--transition); }
    .feed-form:focus-within { border-color: var(--border-hover); }
    textarea { width: 100%; min-height: 80px; background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; resize: none; outline: none; font-size: 15px; font-family: inherit; line-height: 1.5; transition: border-color var(--transition), background var(--transition); }
    textarea:focus { border-color: var(--accent); background: var(--bg-elevated); }
    textarea::placeholder { color: var(--text-muted); }
    .form-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 10px; }
    .post-counter { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .post-counter.warn { color: #f5a623; }
    .post-counter.danger { color: var(--accent); }
    .post { background: var(--bg-card); border: 1px solid var(--border); padding: 16px; border-radius: var(--radius-lg); margin-bottom: 14px; position: relative; word-wrap: break-word; overflow-wrap: break-word; box-shadow: var(--shadow-sm); transition: border-color var(--transition), box-shadow var(--transition); animation: fadeIn .3s ease; }
    .post:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }
    .post-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--bg-elevated); object-fit: cover; flex-shrink: 0; border: 2px solid var(--border); }
    .author-details { display: flex; flex-direction: column; min-width: 0; }
    .author-name { color: var(--text-primary); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 5px; }
    .author-name:hover { text-decoration: underline; }
    .post-content { font-size: 15px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 12px; word-wrap: break-word; overflow-wrap: break-word; color: var(--text-primary); }
    .post-content a, .comment-item a { color: var(--blue); text-decoration: none; font-weight: 600; }
    .post-content a:hover, .comment-item a:hover { text-decoration: underline; }
    .post-actions { display: flex; gap: 18px; border-top: 1px solid var(--border); padding-top: 10px; font-size: 14px; flex-wrap: wrap; align-items: center; }
    .action-btn { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-secondary); transition: color var(--transition), background var(--transition); user-select: none; padding: 5px 10px; border-radius: var(--radius-pill); background: transparent; }
    .action-btn:hover { color: var(--text-primary); background: var(--bg-elevated); }
    .action-btn.liked { color: var(--accent); }
    .action-btn.chat-link { color: var(--blue); }
    .action-btn.delete-btn { color: var(--accent); margin-left: auto; }

    function compressImage(file, maxDim = 1280, quality = 0.82) {
        return new Promise((resolve, reject) => {
            if (!file.type.startsWith('image/')) { reject(new Error("Не изображение")); return; }
            if (file.size > 8 * 1024 * 1024) { reject(new Error("Файл больше 8 МБ")); return; }
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) { const k = Math.min(maxDim / width, maxDim / height); width = Math.round(width * k); height = Math.round(height * k); }
                    const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => reject(new Error("Не удалось прочитать изображение"));
                img.src = e.target.result;
            };
            reader.onerror = () => reject(new Error("Ошибка чтения файла"));
            reader.readAsDataURL(file);
        });

            const avatarSrc = getUserAvatarUrl(author.avatarSeed, author.customAvatar);
            const isMine = String(p.author_id) === String(currentUserId);
            let pollHtml = '';
            if (p.poll_options) {
                let poll = typeof p.poll_options === 'string' ? JSON.parse(p.poll_options) : p.poll_options;
                let votes = allPollVotes.filter(v => v.post_id === p.id); let totalVotes = votes.length; let myVote = votes.find(v => String(v.user_id) === String(currentUserId));
                pollHtml = `<div class="poll-container"><div style="font-weight:bold; margin-bottom:10px;">${escapeHtml(poll.question)}</div>`;
                poll.options.forEach((opt, idx) => {
                    let count = votes.filter(v => v.option_index === idx).length; let percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                    let votedClass = myVote && myVote.option_index === idx ? 'voted' : '';
                    pollHtml += `<div class="poll-option ${votedClass}" onclick="votePoll(${p.id}, ${idx})"><div class="poll-option-bar" style="width: ${percent}%"></div><div class="poll-option-text"><span>${escapeHtml(opt)}</span><span>${percent}% (${count})</span></div></div>`;
                });
                pollHtml += `<div style="font-size:12px; color:var(--text-muted); text-align:right; margin-top:4px;">Всего голосов: ${totalVotes}</div></div>`;
            }

    function handleAvatarUpload(event) { 
        const file = event.target.files?.[0]; 
        if (!file) return; 
        if (!file.type.startsWith('image/')) return alert("Выберите изображение"); 
        if (file.size > 5*1024*1024) return alert("Максимум 5 МБ"); 
        const reader = new FileReader(); 
        reader.onload = (e) => { 
            const img = new Image(); 
            img.onload = () => { 
                const canvas = document.createElement('canvas'); 
                const size = 200; 
                canvas.width = size; canvas.height = size; 
                const ctx = canvas.getContext('2d'); 
                const m = Math.min(img.width, img.height); 
                ctx.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, size, size); 
                pendingAvatar = canvas.toDataURL('image/jpeg', 0.85); 
                document.getElementById('profileAvatarImg').src = pendingAvatar; 
                document.getElementById('headerUserAvatar').src = pendingAvatar; 
                alert("Аватар подготовлен. Нажмите «Сохранить профиль»."); 
            }; 
            img.src = e.target.result; 
        }; 
        reader.readAsDataURL(file); 
        event.target.value = ""; 
    }

        const btn = document.getElementById('saveProfileBtn'); 
        const unlock = lockBtn(btn, "Сохраняем..."); 
        try { 
            const { error } = await db.from('profiles').update({ name, bio, custom_avatar: avatarToSave || null }).eq('id', currentUserId); 
            if (error) throw error; 
            currentUser.name = name; 
            currentUser.bio = bio;

        const container = document.getElementById('chatMessagesContainer'); 
        container.innerHTML = ""; 
        const myId = String(currentUserId); 
        const partnerId = String(activeChatPartner.id); 
        const messages = allServerPosts.filter(p => p.is_chat && ((String(p.author_id) === myId && String(p.chat_to) === partnerId) || (String(p.author_id) === partnerId && String(p.chat_to) === myId))).sort((a,b) => a.id - b.id); 
        if (!messages.length) { container.innerHTML = "<p style='text-align:center;color:#888;margin-top:40px;'>Нет сообщений. Напишите первым!</p>"; } 
        else { 
            const frag = document.createDocumentFragment(); 
            messages.forEach(m => { 
                const isOutgoing = String(m.author_id) === myId; 
                const div = document.createElement('div'); 
                div.className = `msg ${isOutgoing ? 'outgoing' : 'incoming'}`; 
                div.onclick = () => setReply(m.id, m.content.substring(0, 30)); 
                let replyHtml = ''; 
                if (m.reply_to_id) { 
                    const orig = messages.find(x => x.id === m.reply_to_id); 
                    if (orig) replyHtml = `<div class="msg-reply-quote">${escapeHtml(orig.content.substring(0,30))}...</div>`; 
                } 
                div.innerHTML = `${replyHtml}<div>${formatText(m.content)}</div>`; 
                if (m.image_url) { 
                    const img = document.createElement('img'); 
                    img.className = 'msg-image'; 
                    img.src = m.image_url; 
                    img.onclick = (e) => { e.stopPropagation(); openImageFullscreen(m.image_url); }; 
                    div.appendChild(img); 
                } 
                frag.appendChild(div); 
            }); 
            container.appendChild(frag); 
        } 
        container.scrollTop = container.scrollHeight; 
        if (messages.length > 0) { 
            readChats[partnerId] = Math.max(...messages.map(m => m.id)); 
            localStorage.setItem('itp_read_chats', JSON.stringify(readChats)); 
            updateChatsNavBadge(); 
        } 
    }

    function setReply(msgId, text) { replyToPost = msgId; document.getElementById('chatReplyWrap').style.display = 'block'; document.getElementById('chatReplyText').textContent = text + '...'; }
    function cancelReply() { replyToPost = null; document.getElementById('chatReplyWrap').style.display = 'none'; }

    async function sendDirectMessage() { 
        if (!currentUser || !activeChatPartner) return; 
        const input = document.getElementById('chatMessageInput'); 
        const txt = input.value.trim(); 
        if (!txt && !pendingChatImage) return; 
        const imgToSend = pendingChatImage; 
        input.value = ""; 
        clearChatImage(); 
        await db.from('posts').insert({ author_id: currentUserId, chat_to: activeChatPartner.id, content: txt || "", likes: 0, is_chat: true, image_url: imgToSend || null, reply_to_id: replyToPost }); 
        cancelReply(); 
        loadFeedInitial(); 
        renderDirectMessages(); 
    }

    function getChatPartners() { 
        const myId = String(currentUserId); 
        const partners = new Map(); 
        allServerPosts.filter(p => p.is_chat).forEach(p => { 
            let partnerId = null; 
            if (String(p.author_id) === myId) partnerId = String(p.chat_to); 
            else if (String(p.chat_to) === myId) partnerId = String(p.author_id); 
            else return; 
            const existing = partners.get(partnerId); 
            if (!existing || p.id > existing.lastMsgId) { 
                partners.set(partnerId, { partnerId, lastMsgId: p.id, lastText: p.content || "", hasImage: !!p.image_url, fromMe: String(p.author_id) === myId, lastAt: p.created_at }); 
            } 
        }); 
        const res = []; 
        partners.forEach(v => { 
            const u = allUsers.find(x => String(x.id) === v.partnerId); 
            if (u) res.push({ ...v, ...u }); 
        }); 
        return res.sort((a,b) => b.lastMsgId - a.lastMsgId); 
    }

    function countUnreadFor(partnerId) { 
        const myId = String(currentUserId); 
        const lastRead = Number(readChats[partnerId] || 0); 
        return allServerPosts.filter(p => p.is_chat && p.id > lastRead && String(p.author_id) === String(partnerId) && String(p.chat_to) === myId).length; 
    }

    function renderChatsList() { 
        const c = document.getElementById('chatsList'); 
        if (!c || !currentUser) return; 
        const partners = getChatPartners(); 
        if (!partners.length) { c.innerHTML = "<p style='text-align:center;color:#888;'>Пока нет диалогов.</p>"; updateChatsNavBadge(); return; } 
        const frag = document.createDocumentFragment(); 
        partners.forEach(p => { 
            const avatarSrc = getUserAvatarUrl(p.avatarSeed, p.customAvatar); 
            const unread = countUnreadFor(p.partnerId); 
            const item = document.createElement('div'); 
            item.className = 'chat-list-item' + (unread > 0 ? ' unread' : ''); 
            item.innerHTML = `<img class="chat-list-avatar" src="${avatarSrc}"><div class="chat-list-content"><div class="chat-list-name">${escapeHtml(p.name)}</div><div class="chat-list-preview">${p.fromMe ? '<span class="you">Вы: </span>' : ''}${p.lastText ? escapeHtml(p.lastText) : (p.hasImage ? '📷 Фото' : '')}</div></div><div class="chat-list-meta"><div class="chat-list-time">${formatChatTime(p.lastAt)}</div>${unread > 0 ? `<div class="chat-list-badge">${unread}</div>` : ''}</div>`; 
            item.onclick = () => openChatWithId(p.partnerId); 
            frag.appendChild(item); 
        }); 
        c.innerHTML = ""; 
        c.appendChild(frag); 
        updateChatsNavBadge(); 
    }

    function updateChatsNavBadge() { 
        if (!currentUser) return; 
        const total = getChatPartners().reduce((s, c) => s + countUnreadFor(c.partnerId), 0); 
        const badge = document.getElementById('chatsNavBadge'); 
        if (total > 0) { badge.style.display = 'inline-block'; badge.textContent = total > 99 ? '99+' : total; } 
        else { badge.style.display = 'none'; } 
    }

    function applyTheme(theme) { document.body.classList.toggle('light', theme === 'light'); document.getElementById('themeToggle').textContent = theme === 'light' ? '☀️' : '🌙'; }
    function toggleTheme() { const next = document.body.classList.contains('light') ? 'dark' : 'light'; applyTheme(next); localStorage.setItem('itp_theme', next); }

    document.addEventListener('DOMContentLoaded', async () => {
        applyTheme(localStorage.getItem('itp_theme') || 'dark');
        document.getElementById('postText').addEventListener('input', function() { const len = this.value.length; const c = document.getElementById('postCounter'); c.innerText = `${len} / 2000`; });
        
        const hasSession = await restoreSession();
        document.getElementById('screen-loading').style.display = 'none';
        document.getElementById('mainHeader').style.display = 'flex';
        if (hasSession) { await enterApp(); } else { switchScreen('auth'); }
    });

    setInterval(() => { if(currentUser) db.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', currentUserId).then(); }, 60000);
</script>
