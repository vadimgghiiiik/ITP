<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ИТП — Социальная сеть</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <div class="logo">ИТП</div>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Сменить тему">🌙</button>
            <div class="user-badge" id="headerUserBadge" onclick="switchScreen('profile')" style="display:none;">
                <span id="headerUserName">Пользователь</span>
                <img id="headerUserAvatar" src="" alt="Avatar">
            </div>
        </div>
    </header>

    <div id="screen-auth" class="screen active">
        <div class="auth-card">
            <h2>Вход в ИТП</h2>
            <input type="text" id="authLogin" placeholder="Логин" maxlength="30" autocomplete="username">
            <input type="password" id="authPassword" placeholder="Пароль" maxlength="60" autocomplete="current-password"
                   onkeypress="if(event.key==='Enter'){event.preventDefault();doLogin();}">
            <button onclick="doLogin()" id="loginBtn">Войти</button>
            <button class="btn-secondary" onclick="switchScreen('register')">Регистрация</button>
            <button class="btn-secondary" onclick="clearLocalData()" style="font-size:12px;opacity:.7;">Очистить локальные данные</button>
            <p class="auth-error" id="authError"></p>
        </div>
    </div>

    <div id="screen-register" class="screen">
        <div class="auth-card">
            <h2>Регистрация</h2>
            <input type="text" id="regLogin" placeholder="Логин (латиница, 3-20)" maxlength="20" autocomplete="username">
            <input type="text" id="regName" placeholder="Отображаемое имя" maxlength="30">
            <input type="password" id="regPassword" placeholder="Пароль (мин. 6)" maxlength="60" autocomplete="new-password">
            <input type="password" id="regPassword2" placeholder="Повтор пароля" maxlength="60" autocomplete="new-password"
                   onkeypress="if(event.key==='Enter'){event.preventDefault();doRegister();}">
            <button onclick="doRegister()" id="regBtn">Создать аккаунт</button>
            <button class="btn-secondary" onclick="switchScreen('auth')">Назад</button>
            <p class="auth-error" id="regError"></p>
        </div>
    </div>

    <div id="screen-feed" class="screen">
        <div class="feed-form">
            <textarea id="postText" placeholder="Что у вас нового?" maxlength="2000"></textarea>
            <div id="postImagePreviewWrap" style="display:none; margin-top:10px; position:relative;">
                <img id="postImagePreview" style="max-width:100%; max-height:220px; border-radius:12px; display:block; margin:0 auto; border:1px solid var(--border);">
                <button type="button" onclick="clearPostImage()" style="position:absolute; top:6px; right:6px; background:rgba(0,0,0,.65); color:#fff; border:none; border-radius:50%; width:28px; height:28px; padding:0; font-size:14px; cursor:pointer; box-shadow:none;">✕</button>
            </div>
            <div class="form-actions">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button type="button" class="btn-secondary" onclick="document.getElementById('postImageInput').click()" style="padding:8px 12px; font-size:13px;">📷 Фото</button>
                    <input type="file" id="postImageInput" accept="image/*" style="display:none" onchange="handlePostImageSelect(event)">
                    <span id="postCounter" class="post-counter">0 / 2000</span>
                </div>
                <button id="postSubmitBtn" onclick="addPost()">Опубликовать</button>
            </div>
        </div>
        <div id="postsContainer">Загрузка ИТП...</div>
    </div>

    <div id="screen-people" class="screen">
        <div class="people-search">
            <input type="text" id="peopleSearchInput" placeholder="🔍 Поиск по логину или имени..."
                   maxlength="30" oninput="renderPeopleList()">
        </div>
        <div id="peopleContainer">Загрузка списка людей...</div>
    </div>

    <div id="screen-chats" class="screen">
        <div id="chatsListView">
            <div class="chats-list-header">
                <h2>Чаты</h2>
            </div>
            <div id="chatsList">Загрузка чатов...</div>
        </div>

        <div id="chatRoomView" style="display:none;">
            <div class="chat-room-topbar">
                <button class="chat-back-btn" onclick="closeChatRoom()">←</button>
                <img id="chatRoomAvatar" class="chat-room-avatar" src="" alt="" onclick="openChatPartnerProfile()" style="cursor:pointer;">
                <div class="chat-room-name-block" onclick="openChatPartnerProfile()" style="cursor:pointer;">
                    <div id="chatRoomName" class="chat-room-name">—</div>
                    <div id="chatRoomLogin" class="chat-room-login"></div>
                </div>
            </div>
            <div class="chat-layout">
                <div id="chatMessagesContainer" class="chat-messages"></div>
                <div id="chatImagePreviewWrap" style="display:none; padding:8px 12px; background:var(--bg-elevated); border-top:1px solid var(--border); position:relative;">
                    <img id="chatImagePreview" style="max-height:120px; max-width:100%; border-radius:10px; display:block; margin:0 auto;">
                    <button type="button" onclick="clearChatImage()" style="position:absolute; top:4px; right:8px; background:rgba(0,0,0,.65); color:#fff; border:none; border-radius:50%; width:26px; height:26px; padding:0; font-size:13px; cursor:pointer; box-shadow:none;">✕</button>
                </div>
                <div class="chat-footer">
                    <button type="button" onclick="document.getElementById('chatImageInput').click()" id="chatImageBtn" style="background:var(--bg-elevated); color:var(--text-primary); border:1px solid var(--border);">📷</button>
                    <input type="file" id="chatImageInput" accept="image/*" style="display:none" onchange="handleChatImageSelect(event)">
                    <input type="text" id="chatMessageInput" placeholder="Напишите сообщение..." maxlength="1000"
                           onkeypress="if(event.key==='Enter'){event.preventDefault();sendDirectMessage();}">
                    <button onclick="sendDirectMessage()" id="chatSendBtn">➤</button>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-profile" class="screen">
        <div class="profile-card">
            <div class="avatar-wrapper" onclick="document.getElementById('avatarFileInput').click()">
                <img id="profileAvatarImg" src="" alt="Аватар">
                <div class="avatar-overlay">📷 Сменить</div>
            </div>
            <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">

            <input type="text" id="profileNameInput" class="profile-input" placeholder="Ваше имя" maxlength="30">
            <textarea id="profileBioInput" class="profile-bio-input" placeholder="О себе (до 200 символов)" maxlength="200"></textarea>

            <p class="profile-login">Логин: <span id="profileLoginValue">—</span></p>
            <p class="profile-login">В ИТП с: <span id="profileCreatedAt">—</span></p>

            <div class="profile-stats">
                <div class="stat-item">
                    <span class="stat-num" id="myPostsCount">0</span>
                    <span class="stat-label">Постов</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num" id="myLikesCount">0</span>
                    <span class="stat-label">Лайков</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num" id="myFollowingCount">0</span>
                    <span class="stat-label">Подписок</span>
                </div>
            </div>

            <div class="profile-buttons">
                <button onclick="saveProfile()" id="saveProfileBtn">Сохранить профиль</button>
                <button class="btn-secondary" onclick="resetAvatar()">Сбросить аватар</button>
                <button class="btn-secondary logout-btn" onclick="logout()">Выйти</button>
            </div>
        </div>

        <h4 class="user-posts-title">Мои посты</h4>
        <div id="myPostsContainer"></div>
    </div>

    <div id="screen-user" class="screen">
        <div class="profile-card">
            <img id="userProfileAvatar" class="user-profile-avatar" src="" alt="Аватар">
            <h3 class="user-profile-name">
                <span id="userProfileName">—</span>
                <span id="userProfileBadge"></span>
            </h3>
            <p class="profile-login">Логин: <span id="userProfileLogin">—</span></p>
            <p class="profile-login">В ИТП с: <span id="userProfileCreatedAt">—</span></p>
            <p id="userProfileBio" class="user-profile-bio"></p>

            <div class="profile-stats">
                <div class="stat-item">
                    <span class="stat-num" id="userPostsCount">0</span>
                    <span class="stat-label">Постов</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num" id="userLikesCount">0</span>
                    <span class="stat-label">Лайков</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num" id="userFollowingCount">0</span>
                    <span class="stat-label">Подписок</span>
                </div>
            </div>

            <div class="profile-buttons">
                <button id="userFollowBtn" onclick="toggleFollowViewedUser()">Подписаться</button>
                <button onclick="openChatWithViewedUser()">💬 Написать сообщение</button>
                <button class="btn-secondary" onclick="switchScreen('feed')">← Назад в ленту</button>
            </div>
        </div>

        <h4 class="user-posts-title">Посты пользователя</h4>
        <div id="userPostsContainer"></div>
    </div>

    <nav id="mainNav" style="display:none;">
        <div class="nav-item active" id="nav-feed" onclick="switchScreen('feed')">
            <span class="nav-icon">📰</span><span>Лента</span>
        </div>
        <div class="nav-item" id="nav-people" onclick="switchScreen('people')">
            <span class="nav-icon">👥</span><span>Люди</span>
        </div>
        <div class="nav-item" id="nav-chats" onclick="switchScreen('chats')">
            <span class="nav-icon">💬</span><span>Чаты</span>
        </div>
        <div class="nav-item" id="nav-profile" onclick="switchScreen('profile')">
            <span class="nav-icon">👤</span><span>Профиль</span>
        </div>
    </nav>

<style>
    :root {
        --bg-body: #0a0a0b; --bg-header: #16171a; --bg-card: #1a1b1f; --bg-elevated: #22242a;
        --bg-input: #101114; --bg-hover: #26282f; --text-primary: #f5f5f7; --text-secondary: #b6b8c0;
        --text-muted: #6e7078; --accent: #ff4d4d; --accent-hover: #e03a3a; --accent-soft: rgba(255, 77, 77, 0.12);
        --blue: #4bacff; --border: #2a2c33; --border-hover: #3a3c44; --shadow-sm: 0 1px 2px rgba(0,0,0,.25);
        --shadow-md: 0 4px 14px rgba(0,0,0,.35); --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
        --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px;
        --transition: .18s cubic-bezier(.4,0,.2,1);
    }
    body.light {
        --bg-body: #f4f5f7; --bg-header: #ffffff; --bg-card: #ffffff; --bg-elevated: #f0f1f4;
        --bg-input: #f0f1f4; --bg-hover: #e8eaee; --text-primary: #14161a; --text-secondary: #4a4d55;
        --text-muted: #8a8d94; --accent: #e63946; --accent-hover: #c92c39; --accent-soft: rgba(230, 57, 70, 0.10);
        --blue: #1877f2; --border: #e1e3e8; --border-hover: #c8cad0; --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
        --shadow-md: 0 4px 14px rgba(0,0,0,.08); --shadow-lg: 0 12px 32px rgba(0,0,0,.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: manipulation; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    button, .nav-item, .action-btn, .post-header, .person-card, .user-badge, .theme-toggle, .avatar-wrapper, .chat-list-item, .chat-room-avatar, .chat-room-name-block { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    body { background: var(--bg-body); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif; font-size: 15px; line-height: 1.45; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; transition: background var(--transition), color var(--transition); }
    header { background: var(--bg-header); padding: 12px 16px; font-size: 20px; font-weight: 800; color: var(--accent); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px); transition: background var(--transition), border-color var(--transition); }
    .logo { font-weight: 900; letter-spacing: .5px; font-size: 22px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .theme-toggle { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-primary); font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background var(--transition), transform var(--transition), border-color var(--transition); padding: 0; line-height: 1; }
    .theme-toggle:hover { background: var(--bg-hover); transform: rotate(20deg); }
    .theme-toggle:active { transform: scale(.92); }
    .user-badge { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-primary); cursor: pointer; max-width: 60%; padding: 4px 10px 4px 4px; border-radius: var(--radius-pill); background: var(--bg-elevated); border: 1px solid var(--border); transition: background var(--transition), border-color var(--transition); }
    .user-badge:hover { background: var(--bg-hover); border-color: var(--border-hover); }
    .user-badge span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
    .user-badge img { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-input); border: 2px solid var(--accent); object-fit: cover; flex-shrink: 0; }
    .screen { display: none; padding: 16px 16px 40px; max-width: 620px; margin: 0 auto; animation: fadeIn .25s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px 24px; max-width: 380px; margin: 48px auto; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-lg); }
    .auth-card h2 { color: var(--text-primary); text-align: center; margin-bottom: 6px; font-size: 22px; font-weight: 800; }
    .auth-card h2::first-letter { color: var(--accent); }
    .auth-card input { padding: 13px 14px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); border-radius: var(--radius-md); outline: none; font-size: 15px; font-family: inherit; transition: border-color var(--transition), background var(--transition); }
    .auth-card input:focus { border-color: var(--accent); background: var(--bg-elevated); }
    .auth-card input::placeholder { color: var(--text-muted); }
    .auth-error { color: var(--accent); font-size: 13px; text-align: center; min-height: 16px; word-wrap: break-word; }
    button { background: var(--accent); color: #fff; border: none; padding: 11px 20px; border-radius: var(--radius-md); cursor: pointer; font-weight: 700; font-size: 14px; font-family: inherit; transition: background var(--transition), transform var(--transition), opacity var(--transition); box-shadow: var(--shadow-sm); }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); box-shadow: none; }
    .btn-secondary:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--border-hover); }
    .logout-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .logout-btn:hover:not(:disabled) { background: var(--accent-soft); }
    .feed-form { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 18px; box-shadow: var(--shadow-md); transition: border-color var(--transition); }
    .feed-form:focus-within { border-color: var(--border-hover); }
    textarea { width: 100%; min-height: 80px; background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; resize: none; outline: none; font-size: 15px; font-family: inherit; line-height: 1.5; transition: border-color var(--transition), background var(--transition); }
    textarea:focus { border-color: var(--accent); background: var(--bg-elevated); }
    textarea::placeholder { color: var(--text-muted); }
    .form-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 10px; }
    .post-counter { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .post-counter.warn { color: #f5a623; }
    .post-counter.danger { color: var(--accent); }
    .post { background: var(--bg-card); border: 1px solid var(--border); padding: 16px; border-radius: var(--radius-lg); margin-bottom: 14px; position: relative; word-wrap: break-word; overflow-wrap: break-word; box-shadow: var(--shadow-sm); transition: border-color var(--transition), box-shadow var(--transition); animation: fadeIn .3s ease; }
    .post:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }
    .post-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--bg-elevated); object-fit: cover; flex-shrink: 0; border: 2px solid var(--border); }
    .author-details { display: flex; flex-direction: column; min-width: 0; }
    .author-name { color: var(--text-primary); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 5px; }
    .author-name:hover { text-decoration: underline; }
    .post-content { font-size: 15px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 12px; word-wrap: break-word; overflow-wrap: break-word; color: var(--text-primary); }
    .post-actions { display: flex; gap: 18px; border-top: 1px solid var(--border); padding-top: 10px; font-size: 14px; flex-wrap: wrap; align-items: center; }
    .action-btn { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-secondary); transition: color var(--transition), background var(--transition); user-select: none; padding: 5px 10px; border-radius: var(--radius-pill); background: transparent; }
    .action-btn:hover { color: var(--text-primary); background: var(--bg-elevated); }
    .action-btn.liked { color: var(--accent); }
    .action-btn.chat-link { color: var(--blue); }
    .action-btn.delete-btn { color: var(--accent); margin-left: auto; }
    .action-btn.delete-btn:hover { background: var(--accent-soft); }
    .verified-badge { display: inline-block; width: 18px; height: 18px; flex-shrink: 0; background-size: contain; background-repeat: no-repeat; background-position: center; vertical-align: middle; }
    .verified-badge.verified-blue { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2l2.6 5.6h6.1l-3.1 5 3.1 5h-6.1L12 22l-2.6-4.4H3.3l3.1-5-3.1-5h6.1L12 2z' fill='%231d9bf0' stroke='%231d9bf0' stroke-width='1.2' stroke-linejoin='round'/><path d='M10.9 14.9l-2.4-2.4a.85.85 0 1 1 1.2-1.2l1.8 1.8 3.4-3.4a.85.85 0 1 1 1.2 1.2l-4 4a.85.85 0 0 1-1.2 0z' fill='white'/></svg>"); }
    .verified-badge.verified-white { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2l2.6 5.6h6.1l-3.1 5 3.1 5h-6.1L12 22l-2.6-4.4H3.3l3.1-5-3.1-5h6.1L12 2z' fill='white' stroke='%23cccccc' stroke-width='1.2' stroke-linejoin='round'/><path d='M10.9 14.9l-2.4-2.4a.85.85 0 1 1 1.2-1.2l1.8 1.8 3.4-3.4a.85.85 0 1 1 1.2 1.2l-4 4a.85.85 0 0 1-1.2 0z' fill='%23111'/></svg>"); }
    .profile-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px 20px; margin-bottom: 16px; box-shadow: var(--shadow-md); animation: fadeIn .3s ease; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .avatar-wrapper { position: relative; display: block; cursor: pointer; margin: 0 auto 16px auto; border-radius: 50%; overflow: hidden; width: 110px; height: 110px; flex-shrink: 0; }
    .avatar-wrapper img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--accent); object-fit: cover; display: block; transition: filter var(--transition); background: var(--bg-elevated); }
    .avatar-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.7); color: #fff; font-size: 12px; font-weight: 600; padding: 6px 0; opacity: 0; transition: opacity var(--transition); text-align: center; }
    .avatar-wrapper:hover img { filter: brightness(.55); }
    .avatar-wrapper:hover .avatar-overlay { opacity: 1; }
    .user-profile-avatar { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--accent); object-fit: cover; background: var(--bg-elevated); margin: 0 auto 16px auto; display: block; }
    .user-profile-name { font-size: 20px; color: var(--text-primary); display: flex; justify-content: center; align-items: center; gap: 6px; margin-bottom: 6px; font-weight: 800; text-align: center; width: 100%; flex-wrap: wrap; }
    .profile-input { width: 100%; padding: 11px 14px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); border-radius: var(--radius-md); text-align: center; font-size: 16px; font-weight: 700; margin-bottom: 10px; outline: none; font-family: inherit; transition: border-color var(--transition); }
    .profile-input:focus { border-color: var(--accent); }
    .profile-bio-input { width: 100%; min-height: 60px; max-height: 120px; padding: 11px 14px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); border-radius: var(--radius-md); font-size: 14px; margin-bottom: 12px; outline: none; font-family: inherit; resize: vertical; transition: border-color var(--transition); text-align: center; }
    .profile-bio-input:focus { border-color: var(--accent); }
    .profile-login { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; text-align: center; width: 100%; }
    .profile-login span { color: var(--text-secondary); font-weight: 600; }
    .profile-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; width: 100%; }

        if (str == null) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

    function formatDate(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        if (isNaN(d.getTime())) return "—";
        return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'long', year:'numeric' });
    }
    function formatChatTime(ts) {
        if (!ts) return "";
        const d = new Date(ts);
        const now = new Date();
        if (d.toDateString() === now.toDateString())
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        const y = new Date(now); y.setDate(now.getDate()-1);
        if (d.toDateString() === y.toDateString()) return 'вчера';
        return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;
    }
    function isBadFaker(s) { return !s || String(s).startsWith("Invalid faker method"); }

    // === СЖАТИЕ ИЗОБРАЖЕНИЙ ===
    function compressImage(file, maxDim = MAX_IMAGE_DIM, quality = 0.82) {
        return new Promise((resolve, reject) => {
            if (!file.type.startsWith('image/')) { reject(new Error("Не изображение")); return; }
            if (file.size > 8 * 1024 * 1024) { reject(new Error("Файл больше 8 МБ")); return; }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        const k = Math.min(maxDim / width, maxDim / height);
                        width  = Math.round(width  * k);
                        height = Math.round(height * k);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => reject(new Error("Не удалось прочитать изображение"));
                img.src = e.target.result;
            };
            reader.onerror = () => reject(new Error("Ошибка чтения файла"));
            reader.readAsDataURL(file);
        });
    }

    function loginToEmail(login) {
        return `${login.toLowerCase()}@example.com`;
    }
    function emailToLogin(email) {
        return (email || "").replace(/@example\.com$/, '');
    }

    async function doLogin() {
        const login = document.getElementById('authLogin').value.trim().toLowerCase();
        const password = document.getElementById('authPassword').value;
        const errEl = document.getElementById('authError');
        const btn   = document.getElementById('loginBtn');
        errEl.textContent = "";

        if (!login || !password) return (errEl.textContent = "Заполните все поля");

        const unlock = lockBtn(btn, "Входим...");
        try {
            const { error } = await db.auth.signInWithPassword({
                email: loginToEmail(login),
                password
            });
            if (error) throw new Error("Неверный логин или пароль");

            await refreshCurrentUser();
            await enterApp();
        } catch (e) {
            errEl.textContent = e.message;
        } finally {
            unlock();
        }
    }

    async function doRegister() {
        const login  = document.getElementById('regLogin').value.trim().toLowerCase();
        const name   = document.getElementById('regName').value.trim();
        const pass1  = document.getElementById('regPassword').value;
        const pass2  = document.getElementById('regPassword2').value;
        const errEl  = document.getElementById('regError');
        const btn    = document.getElementById('regBtn');
        errEl.textContent = "";

        if (!/^[a-z0-9_]{3,20}$/.test(login)) return (errEl.textContent = "Логин: 3-20 символов, латиница/цифры/_");
        if (name.length < 2 || name.length > MAX_NAME_LEN) return (errEl.textContent = "Имя: от 2 до 30 символов");
        if (pass1.length < 6) return (errEl.textContent = "Пароль минимум 6 символов");
        if (pass1 !== pass2) return (errEl.textContent = "Пароли не совпадают");

        const unlock = lockBtn(btn, "Создаём...");
        try {
            const { data: existing } = await db.from('profiles').select('id').eq('login', login).maybeSingle();
            if (existing) { errEl.textContent = "Такой логин уже занят"; return; }

            const isVerified = normalizeVerified(VERIFIED_LOGINS[login] || "");

            const { data: signUpData, error } = await db.auth.signUp({
                email: loginToEmail(login),
                password: pass1,
                options: {
                    data: { login, name, avatar_seed: login, is_verified: isVerified }
                }
            });
            if (error) throw error;

            const { error: loginErr } = await db.auth.signInWithPassword({
                email: loginToEmail(login),
                password: pass1
            });

            await refreshCurrentUser();
            await enterApp();

            errEl.textContent = "Ошибка: " + e.message;
            console.error(e);
        } finally {
            unlock();
        }

    async function refreshCurrentUser() {
        const { data: { user } } = await db.auth.getUser();
        if (!user) { currentUser = null; return null; }

        const { data: profile, error } = await db
            .from('profiles').select('*').eq('id', user.id).single();

        if (error || !profile) {
            const login = emailToLogin(user.email);
            const { data: newProfile } = await db.from('profiles').upsert({
                id: user.id, login, name: login, avatar_seed: login, is_verified: ''
            }).select().single();
            
            if (newProfile) {
                currentUser = mapProfile(newProfile);
                currentUserId = currentUser.id;
                return currentUser;
            }
            currentUser = null;
            return null;
        }
        currentUser = mapProfile(profile);
        currentUserId = currentUser.id;
        localStorage.setItem('itp_session', JSON.stringify(currentUser));
        return currentUser;
    }

        return {
            id: p.id,
            login: p.login,
            name: p.name || p.login,
            avatarSeed: p.avatar_seed || p.login,
            customAvatar: (p.custom_avatar && p.custom_avatar.startsWith('data:image'))
                ? p.custom_avatar : null,
            isVerified: normalizeVerified(p.is_verified),
            bio: p.bio || "",
            createdAt: p.created_at || "",
            following: Array.isArray(p.following) ? p.following : []
        };
    }

    const likeLocks = new Set();
    async function toggleLike(postId, currentLikes) {
        const idStr = String(postId);
        if (likeLocks.has(idStr)) return;
        likeLocks.add(idStr);

        let liked = JSON.parse(localStorage.getItem('itp_liked') || "[]");
        const hasLiked = liked.includes(idStr);
        const newCount = hasLiked ? Math.max(0, currentLikes - 1) : currentLikes + 1;

        if (hasLiked) liked = liked.filter(x => x !== idStr);
        else liked.push(idStr);
        localStorage.setItem('itp_liked', JSON.stringify(liked));

        const el = document.getElementById(`like-count-${postId}`);
        const parent = document.getElementById(`like-btn-${postId}`);
        if (el) el.innerText = newCount;
        if (parent) parent.classList.toggle('liked', !hasLiked);

        try {
            const { error } = await db.from('posts').update({ likes: newCount }).eq('id', postId);
            if (error) throw error;
        } catch (e) {
            if (hasLiked) liked.push(idStr);
            else liked = liked.filter(x => x !== idStr);
            localStorage.setItem('itp_liked', JSON.stringify(liked));
            if (el) el.innerText = currentLikes;
            if (parent) parent.classList.toggle('liked', hasLiked);
        } finally { likeLocks.delete(idStr); }
    }

        const txt = document.getElementById('postText').value;

        c.innerText = `${txt.length} / ${MAX_POST_LEN}`;

        if (txt.length > MAX_POST_LEN * 0.9) c.classList.add('danger');
        else if (txt.length > MAX_POST_LEN * 0.7) c.classList.add('warn');

    function handleAvatarUpload(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) return alert("Выберите изображение");
        if (file.size > 5*1024*1024) return alert("Максимум 5 МБ");

        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const size = 200; canvas.width = size; canvas.height = size;
                const ctx = canvas.getContext('2d');
                const m = Math.min(img.width, img.height);
                ctx.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, size, size);
                pendingAvatar = canvas.toDataURL('image/jpeg', 0.85);
                document.getElementById('profileAvatarImg').src = pendingAvatar;
                document.getElementById('headerUserAvatar').src = pendingAvatar;
                alert("Аватар подготовлен. Нажмите «Сохранить профиль».");
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
        event.target.value = "";
    }

    function renderDirectMessages() {
        if (!currentUser || !activeChatPartner) return;
        const container = document.getElementById('chatMessagesContainer');
        const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 50;
        container.innerHTML = "";

        const myId = String(currentUserId);
        const partnerId = String(activeChatPartner.id);

        const messages = allServerPosts.filter(p => 
            p.is_chat && 
            ((String(p.author_id) === myId && String(p.chat_to) === partnerId) ||
             (String(p.author_id) === partnerId && String(p.chat_to) === myId))
        ).sort((a,b) => a.id - b.id);

        if (!messages.length) {
            container.innerHTML = "<p style='text-align:center;color:#888;margin-top:40px;'>Нет сообщений. Напишите первым!</p>";
        } else {
            const frag = document.createDocumentFragment();
            messages.forEach(m => {
                const isOutgoing = String(m.author_id) === myId;
                const hasImg = !!m.image_url;
                const hasText = !!m.content;
                const div = document.createElement('div');
                div.className = `msg ${isOutgoing ? 'outgoing' : 'incoming'}${hasImg && !hasText ? ' image-only' : ''}`;
                if (hasImg) {
                    const img = document.createElement('img');
                    img.className = 'msg-image';
                    img.src = m.image_url;
                    img.loading = 'lazy';
                    img.style.cursor = 'zoom-in';
                    img.onclick = () => openImageFullscreen(m.image_url);
                    div.appendChild(img);
                }
                if (hasText) {
                    const t = document.createElement('div');
                    t.innerText = m.content;
                    div.appendChild(t);
                }
                frag.appendChild(div);
            });
            container.appendChild(frag);
        }

        if (wasAtBottom) container.scrollTop = container.scrollHeight;

        if (messages.length > 0) {
            const maxId = Math.max(...messages.map(m => m.id));
            readChats[partnerId] = maxId;
            saveReadChats();
            updateChatsNavBadge();
        }
    }

    function getChatPartners() {
        const myId = String(currentUserId);
        const partners = new Map();

        allServerPosts.filter(p => p.is_chat).forEach(p => {
            let partnerId = null;
            if (String(p.author_id) === myId) partnerId = String(p.chat_to);
            else if (String(p.chat_to) === myId) partnerId = String(p.author_id);
            else return;

            const existing = partners.get(partnerId);
            if (!existing || p.id > existing.lastMsgId) {
                partners.set(partnerId, {
                    partnerId,
                    lastMsgId: p.id,
                    lastText: p.content || "",
                    hasImage: !!p.image_url,
                    fromMe: String(p.author_id) === myId,
                    lastAt: p.created_at
                });
            }
        });

        const res = [];
        partners.forEach(v => {
            const u = allUsers.find(x => String(x.id) === v.partnerId);
            if (u) res.push({ ...v, ...u });
        });
        return res.sort((a,b) => b.lastMsgId - a.lastMsgId);
    }

    function countUnreadFor(partnerId) {
        const myId = String(currentUserId);
        const lastRead = Number(readChats[partnerId] || 0);
        return allServerPosts.filter(p => 
            p.is_chat && p.id > lastRead && 
            String(p.author_id) === String(partnerId) && String(p.chat_to) === myId
        ).length;
    }

    }

    function updateChatsNavBadge() {
        if (!currentUser) return;
        const total = getChatPartners().reduce((s, c) => s + countUnreadFor(c.partnerId), 0);
        const nav = document.getElementById('nav-chats');
        let badge = nav.querySelector('.nav-badge');
        if (total > 0) {
            if (!badge) {
                badge = document.createElement('span');
                badge.className = 'nav-badge';
                nav.appendChild(badge);
            }
            badge.textContent = total > 99 ? '99+' : total;
        } else if (badge) badge.remove();
    }

    // ==================== НАВИГАЦИЯ И СТАРТ ====================
    function switchScreen(name) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(`screen-${name}`)?.classList.add('active');
        document.getElementById(`nav-${name}`)?.classList.add('active');
        if (name === 'profile') { updateMyStats(); renderMyPosts(); }
        if (name === 'people') renderPeopleList();
        if (name === 'chats') closeChatRoom();
        window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function applyTheme(theme) {
        document.body.classList.toggle('light', theme === 'light');
        document.getElementById('themeToggle').textContent = theme === 'light' ? '☀️' : '🌙';
    }
    function toggleTheme() {
        const next = document.body.classList.contains('light') ? 'dark' : 'light';
        applyTheme(next);
        localStorage.setItem('itp_theme', next);
    }

    document.addEventListener('DOMContentLoaded', async () => {
        applyTheme(localStorage.getItem('itp_theme') || 'dark');
        document.getElementById('postText').addEventListener('input', updatePostCounter);
        updatePostCounter();

        if (await restoreSession()) {
            await enterApp();
        } else {
            switchScreen('auth');
        }
    });
</script>
</body>
</html>
